name: E2E Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - "scripts/e2e/**"
      - "scripts/qa/**"
      - "src/lib/test-harness/**"
      - "src/app/api/test/**"
      - ".env.e2e"
      - ".github/workflows/e2e.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e \"console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)\")" >> $GITHUB_OUTPUT
        shell: bash
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Run E2E
        run: npm run e2e -- --project=chromium --project=mobile-chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
